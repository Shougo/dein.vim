# Dependabot: updates of the GitHub Actions,
# once a month, of releases at least 7 days old (time for a broken or
# malicious release to be found), each in one pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
